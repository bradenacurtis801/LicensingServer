version: '3.8'

# App-only compose — expects an external PostgreSQL instance.
# Set DATABASE_URL in your .env to point at it.

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: licensing-api
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DOCKER_ENV=true
      - DEBUG=${DEBUG}
      - APP_NAME=${APP_NAME}
      - APP_VERSION=${APP_VERSION}
      - BACKEND_PORT=${BACKEND_PORT}
      - LICENSE_KEY_LENGTH=${LICENSE_KEY_LENGTH}
      - API_V1_PREFIX=${API_V1_PREFIX}
      - CORS_ORIGINS=${CORS_ORIGINS}
      # RSA private key is mounted from the host — generate with:
      #   openssl genrsa -out private.pem 2048
      - RSA_PRIVATE_KEY_PATH=/secrets/private.pem
    volumes:
      - app_logs:/var/log/licensing-server
      - app_data:/var/lib/licensing-server/data
      - app_cache:/var/cache/licensing-server
      - ../private.pem:/secrets/private.pem:ro
    ports:
      - "${BACKEND_PORT}:8000"
    networks:
      - app-network
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  app_logs:
    driver: local
  app_data:
    driver: local
  app_cache:
    driver: local

networks:
  app-network:
    driver: bridge
